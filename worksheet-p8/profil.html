<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Game Favorit</title>

    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="komponen.css">
    <link rel="stylesheet" href="tema.css">
    <link rel="stylesheet" href="responsif.css">
</head>

<body>

    <div class="page">

        <header class="navbar">

            <input type="checkbox" id="tema" class="pengalih-tema">
            <label for="tema" class="tombol-tema">Tema gelap</label>

            <div class="header-baris">

                <h1 id="judul-halaman"></h1>

                <nav aria-label="Navigasi utama">
                    <ul>
                        <li><a href="#koleksi">Koleksi Game</a></li>
                        <li><a href="#tentang">Tentang Saya</a></li>
                        <li><a href="#tambah">Tambah Game</a></li>
                    </ul>
                </nav>

            </div>

        </header>

        <div class="isi">

            <main class="utama">

                <section id="koleksi">

                    <h2 id="judul-koleksi"></h2>

                    <p id="deskripsi-koleksi"></p>

                    <div class="katalog">

                        <div class="table-wrap">

                            <table class="kartu papan">

                                <caption>Daftar Game Favorit</caption>

                                <thead>
                                    <tr>
                                        <th scope="col">Nama Game</th>
                                        <th scope="col">Genre</th>
                                        <th scope="col">Platform</th>
                                    </tr>
                                </thead>

                                <tbody id="daftar-game"></tbody>

                            </table>

                        </div>

                    </div>

                    <figure class="slideshow">

                        <div class="slide">

                            <img
                                src="ea-sports-fc-26.jpg"
                                alt="Sampul game EA Sports FC 26"
                                width="640"
                                height="360"
                                loading="lazy">

                            <span class="nama-slide"></span>

                        </div>

                        <div class="slide">

                            <img
                                src="motogp.jpg"
                                alt="Sampul game MotoGP"
                                width="640"
                                height="360"
                                loading="lazy">

                            <span class="nama-slide"></span>

                        </div>

                        <div class="slide">

                            <img
                                src="gta-v.jpg"
                                alt="Sampul game GTA V"
                                width="640"
                                height="360"
                                loading="lazy">

                            <span class="nama-slide"></span>

                        </div>

                    </figure>

                </section>

                <section id="tentang">

                    <h2>Tentang Saya</h2>

                    <p id="tentang-saya"></p>

                    <div id="tambah">

                        <h3>Tambah Game Favorit</h3>

                        <form action="/simpan" method="post">

                            <div class="form-kolom">

                                <label for="nama-game">Nama Game:</label>

                                <input
                                    type="text"
                                    id="nama-game"
                                    name="nama-game"
                                    required>

                                <p class="pesan-galat">
                                    Isi nama game.
                                </p>

                            </div>

                            <div class="form-kolom">

                                <label for="genre">Genre:</label>

                                <input
                                    type="text"
                                    id="genre"
                                    name="genre"
                                    required>

                                <p class="pesan-galat">
                                    Isi genre game.
                                </p>

                            </div>

                            <div class="form-kolom">

                                <label for="platform">Platform:</label>

                                <input
                                    type="text"
                                    id="platform"
                                    name="platform"
                                    required>

                                <p class="pesan-galat">
                                    Isi platform game.
                                </p>

                            </div>

                            <button type="submit">
                                Tambah Game
                            </button>

                        </form>

                    </div>

                </section>

            </main>

        </div>

        <footer>

            <p>
                GHIFARI PUTRA PRATAMA · 25523186 · 2026
            </p>

        </footer>

    </div>

    <script type="module" src="js/app.js"></script>

</body>

</html>
